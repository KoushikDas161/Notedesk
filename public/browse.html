<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Notes — NoteDesk</title>
<meta name="description" content="Search and filter academic notes by subject, category, and file type.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand"><span class="brand-mark">nd</span><span class="brand-text">NoteDesk</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse Notes</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <div class="nav-actions" data-auth-slot>
      <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
      <a href="upload.html" class="btn btn-primary btn-sm"><span class="long">+ Upload a note</span><span class="short" aria-hidden="true">+</span></a>
    </div>
  </nav>
</header>

<main>
  <section class="section" style="padding-bottom:0;">
    <div class="container">
      <span class="eyebrow">Browse</span>
      <h1>Find notes for any course</h1>
      <p class="lead">Search by keyword, then narrow things down by subject, category, or file type.</p>

      <div class="search-bar" style="max-width:640px; margin-top:1rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by title, subject, course, or tag…">
      </div>

      <div class="filter-bar">
        <select id="subjectFilter"><option value="">All subjects</option></select>
        <select id="categoryFilter"><option value="">All categories</option></select>
        <select id="typeFilter"><option value="">All file types</option></select>
        <select id="sortFilter">
          <option value="recent">Newest first</option>
          <option value="popular">Most viewed</option>
          <option value="downloads">Most downloaded</option>
          <option value="oldest">Oldest first</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="clearFilters" type="button">Clear filters</button>
        <span class="filter-count" id="resultCount"></span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="note-grid" id="noteGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>A student coursework project.</span>
      <span>web development</span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
